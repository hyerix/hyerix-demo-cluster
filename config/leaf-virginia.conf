# Aerolux Logistics — edge POP Virginia.
#
# Leaf node attached to the US regional hub (aerolux-us). Runs a local
# JetStream domain so edge apps can work offline and buffer to the hub.
# No cluster, no gateway — this is a single-node edge server.

server_name: edge-virginia

jetstream {
  store_dir: /data
  max_file_store: 256MB
  max_memory_store: 64MB
  domain: edge_virginia
}

http_port: 8222

accounts: {
  $SYS: {
    users: [{ user: sys, password: sys }]
  }
}

system_account: "$SYS"

leafnodes {
  remotes: [
    {
      urls: ["nats-leaf://sys:sys@nats-us-1:7422", "nats-leaf://sys:sys@nats-us-2:7422", "nats-leaf://sys:sys@nats-us-3:7422"]
      account: "$SYS"
    }
  ]
}
