# Aerolux Logistics — EU region NATS JetStream config.
#
# Used by nats-eu-1 / nats-eu-2 / nats-eu-3. Each container passes a distinct
# --name flag so the servers self-identify inside the `aerolux-eu` cluster.
# Public-safe: only the sys/sys system account, no JWT, no nkeys.

jetstream {
  store_dir: /data
  max_file_store: 8GB
  max_memory_store: 256MB
}

http_port: 8222

accounts: {
  $SYS: {
    users: [{ user: sys, password: sys }]
  }
}

system_account: "$SYS"

cluster {
  name: aerolux-eu
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-eu-1:6222
    nats-route://nats-eu-2:6222
    nats-route://nats-eu-3:6222
  ]
}

gateway {
  name: aerolux-eu
  listen: 0.0.0.0:7222
  gateways: [
    { name: "aerolux-us",   urls: ["nats://nats-us-1:7222",   "nats://nats-us-2:7222",   "nats://nats-us-3:7222"]   }
    { name: "aerolux-apac", urls: ["nats://nats-apac-1:7222", "nats://nats-apac-2:7222", "nats://nats-apac-3:7222"] }
  ]
}

leafnodes {
  listen: 0.0.0.0:7422
}
