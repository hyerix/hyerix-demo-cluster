# Aerolux Logistics — edge POP Frankfurt.
#
# Leaf node attached to the EU regional hub (aerolux-eu). Runs a local
# JetStream domain so edge apps can work offline and buffer to the hub.
# No cluster, no gateway — this is a single-node edge server.

server_name: edge-frankfurt

jetstream {
  store_dir: /data
  max_file_store: 256MB
  max_memory_store: 64MB
  domain: edge_frankfurt
}

http_port: 8222

accounts: {
  $SYS: {
    users: [{ user: sys, password: sys }]
  }
}

system_account: "$SYS"

leafnodes {
  remotes: [
    {
      urls: ["nats-leaf://sys:sys@nats-eu-1:7422", "nats-leaf://sys:sys@nats-eu-2:7422", "nats-leaf://sys:sys@nats-eu-3:7422"]
      account: "$SYS"
    }
  ]
}
