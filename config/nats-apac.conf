# Aerolux Logistics — APAC region NATS JetStream config.
#
# Used by nats-apac-1 / nats-apac-2 / nats-apac-3. Each container passes a
# distinct --name flag so the servers self-identify inside the `aerolux-apac`
# cluster. Public-safe: only the sys/sys system account, no JWT, no nkeys.

jetstream {
  store_dir: /data
  max_file_store: 8GB
  max_memory_store: 256MB
}

http_port: 8222

accounts: {
  $SYS: {
    users: [{ user: sys, password: sys }]
  }
}

system_account: "$SYS"

cluster {
  name: aerolux-apac
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-apac-1:6222
    nats-route://nats-apac-2:6222
    nats-route://nats-apac-3:6222
  ]
}

gateway {
  name: aerolux-apac
  listen: 0.0.0.0:7222
  gateways: [
    { name: "aerolux-eu", urls: ["nats://nats-eu-1:7222", "nats://nats-eu-2:7222", "nats://nats-eu-3:7222"] }
    { name: "aerolux-us", urls: ["nats://nats-us-1:7222", "nats://nats-us-2:7222", "nats://nats-us-3:7222"] }
  ]
}

leafnodes {
  listen: 0.0.0.0:7422
}
